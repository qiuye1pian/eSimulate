name: esimulate

services:
  mysql:
    # Pin to an explicit MySQL 8.0 patch version instead of using latest.
    image: mysql:8.0.41
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-eSimulate}
      MYSQL_USER: ${MYSQL_USER:-simulator}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-simulatorPassword}
    ports:
      - "${MYSQL_HOST_PORT:-3306}:3306"
    volumes:
      - esimulate_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  backend:
    image: crpi-jofg3qfjap2gegjm.cn-heyuan.personal.cr.aliyuncs.com/e-simulate/backend-and-database:latest
    restart: always
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "${BACKEND_HOST_PORT:-8080}:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-eSimulate}?useSSL=false&serverTimezone=UTC&characterEncoding=UTF-8&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER:-simulator}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:-simulatorPassword}
      # Use update for this lightweight ECS deployment so the imported schema can match the current entity model.
      SPRING_JPA_HIBERNATE_DDL_AUTO: ${SPRING_JPA_HIBERNATE_DDL_AUTO:-update}

volumes:
  esimulate_mysql_data:
